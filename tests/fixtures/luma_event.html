<script data-cfasync="false" type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"Event","@id":"https://luma.com/592fcwx2","url":"https://luma.com/592fcwx2","name":"Open Source AI Week 2026 | Open Weight Debate Night","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","location":{"@type":"Place","name":"San Francisco, CA","address":{"@type":"PostalAddress","addressLocality":"San Francisco","addressRegion":"California","addressCountry":"US"},"geo":{"@type":"GeoCoordinates","latitude":37.78284627463162,"longitude":-122.39348320501524},"latitude":37.78284627463162,"longitude":-122.39348320501524},"image":["https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1920,height=1920/uploads/i1/5cbf2941-cc61-4e83-a65f-e1cbe1c1048e.png","https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1200,height=630/event-social/rz/623d2b64-fe38-4f21-a36b-72adf18d1655.png"],"description":"Open Source AI Week 2026 | Open Weight Debate Night\nThe Open Weight Debate is where Open Source AI Week gets into discussion, opinions, and fun. We're bringing together sharp minds who actually like to debate and discuss with each other and putting them on stage to hash it out live.\nReal arguments, real examples, and real dialogue about the questions that matter most to the future of open source AI from leaders shaping the AI ecosystem including Ion Stoica (UC Berkeley, Databricks, Anyscale),  Percy Liang (Stanford, MARIN Project, Open Athena), Ben Brooks (Black Forest Labs), Cheryl Cheng (M12), Malo Bourgon (MIRI), David Bellamy, MBZUAI Institute of Foundation Models) and moderated by Michael Schwarz (Microsoft), Vibhu Sapra (AI Engineer / Latent Space), and Sophia Dew (MTS Live).\nWe're hosting at GitHub HQ where the developer minds are at.\nAgenda\n5:30 PM – Registration & Networking\n6:00 PM – Welcome & Event Overview\n6:15 PM – Debate #1: The risks of publicly releasing frontier AI model weights outweigh the benefits.\n7:00 PM – Debate #2: Enterprises will always prefer closed models over open models.\n7:45 PM – Debate #3: Closed models will retain an overall performance capability advantage over open-weight models\n8:25 PM – Closing Remarks & Next Event Announcements\n8:30 PM – Event Concludes\nExpect some spicy takes, a few surprises, learn a few things, disagree or agree. Whether you're firmly on one side of the debate or genuinely undecided, this is the session where things get interesting fast.\nThis is one of the highlight events of Open Source AI Week. Check out opensourceaiweek.com for the full lineup and more info on what else is happening throughout the week.\nAbout the hosts\nMicrosoft delivers the cloud, AI, and data platforms that help researchers and enterprises build, train, and deploy intelligent systems at scale. Through Windows, Microsoft Foundry, and Azure computing infrastructure, Microsoft is accelerating scientific discovery and innovation from on device to cloud.\nGitHub is the world's leading developer platform, helping millions of developers build software with AI. Through GitHub Copilot, open source collaboration, and developer workflows, GitHub is bringing agentic AI capabilities to researchers, startups, and enterprises alike.\nOpen Intelligence Foundation is a community-first nonprofit founded to protect, strengthen, and advance open-source AI, open models, and open science. The foundation also leads Open Source AI Week, a community-run initiative celebrating open-source AI.","startDate":"2026-10-19T17:00:00.000-07:00","endDate":"2026-10-19T21:00:00.000-07:00","organizer":[{"@type":"Organization","name":"Open Source AI Week","url":"https://luma.com/opensourceaiweek","image":"https://images.lumacdn.com/uploads/wq/4cd355ee-9ded-4a9c-a221-b1aa5823d3a8.jpg"},{"@type":"Person","name":"Matt White","url":"https://luma.com/user/electroshock","image":"https://images.lumacdn.com/uploads/0z/1d4adcb4-d75d-4b48-8f92-dc9bab9492c2.png"},{"@type":"Person","name":"GitHub","url":"https://luma.com/user/GitHubCommunity","image":"https://images.lumacdn.com/avatars/4z/b23ec411-acab-4aee-811e-06a53b4e92dc.png"},{"@type":"Person","name":"Open Intelligence Foundation","url":"https://luma.com/user/usr-vDrNwzCwNg51297","image":"https://images.lumacdn.com/uploads/9b/39d233b9-84b5-40a4-afdf-aa70af8dfd10.png"}],"offers":[{"@type":"Offer","url":"https://luma.com/592fcwx2","name":"General Admission","price":0,"priceCurrency":"usd","availability":"https://schema.org/InStock"}]}</script>
